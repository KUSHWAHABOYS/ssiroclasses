  <!-- WELCOME-CLEANUP: Removed connectModal.css link -->

  <style>
    /* NETLIFY-KILLER: Complete elimination of Netlify Badge / Watermark */
    [id*="netlify" i],
    [class*="netlify" i],
    [data-netlify],
    iframe[src*="netlify" i],
    a[href*="netlify" i],
    div[class*="feedback" i],
    .netlify-badge,
    #netlify-badge,
    netlify-badge,
    body > div[style*="fixed"][style*="bottom"],
    body > a[style*="fixed"][style*="bottom"],
    body > a[href*="netlify" i] {
      display: none !important;
      opacity: 0 !important;
      visibility: hidden !important;
      pointer-events: none !important;
      width: 0 !important;
      height: 0 !important;
      max-width: 0 !important;
      max-height: 0 !important;
      position: absolute !important;
      left: -99999px !important;
      top: -99999px !important;
      z-index: -99999 !important;
      transform: scale(0) !important;
      overflow: hidden !important;
    }

    /* SSIRO-UPDATE: Critical inline CSS for zero-flash Welcome Screen */
    .welcome-screen {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100dvh;
      background: linear-gradient(135deg, #14306B 0%, #0A1633 100%);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      touch-action: none;
      user-select: none;
      transition: opacity 300ms ease, visibility 300ms ease;
    }
    .welcome-screen.fade-out {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .welcome-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      position: relative;
      padding: 24px;
      max-width: 90vw;
    }
    .welcome-logo-container {
      height: 14vh;
      max-height: 120px;
      aspect-ratio: 1;
      margin-bottom: 24px;
      animation: welcomeLogoIn 400ms cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .welcome-text-glow {
      position: absolute;
      width: 60%;
      height: 40%;
      background: radial-gradient(circle, rgba(255, 215, 106, 0.18) 0%, rgba(232, 137, 12, 0) 70%);
      filter: blur(40px);
      pointer-events: none;
      animation: welcomeGlowPulse 3s ease-in-out infinite alternate;
    }
    .welcome-title {
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: clamp(40px, 7.5vw, 160px);
      line-height: 1.05;
      letter-spacing: -0.01em;
      font-weight: 800;
      font-family: 'Inter', 'Poppins', 'Noto Sans Devanagari', sans-serif;
    }
    .welcome-line-1 {
      font-size: 0.6em;
      color: #ffffff;
      opacity: 0;
      animation: welcomeTextRise 450ms cubic-bezier(0.16, 1, 0.3, 1) 150ms forwards;
    }
    .welcome-line-2 {
      font-size: 1em;
      background: linear-gradient(135deg, #FFD76A 0%, #E8890C 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      opacity: 0;
      animation: welcomeTextRise 450ms cubic-bezier(0.16, 1, 0.3, 1) 300ms forwards;
    }
    .welcome-underline {
      height: 3px;
      width: 0%;
      background: linear-gradient(90deg, transparent 0%, #FFD76A 50%, transparent 100%);
      margin-top: 16px;
      animation: welcomeUnderlineIn 500ms ease-out 450ms forwards;
    }
    /* WELCOME-FIX: Touch-friendly large Open Deck button & drop hint */
    .welcome-actions {
      margin-top: 36px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      opacity: 0;
      animation: welcomeHintFade 400ms ease-in 500ms forwards;
      pointer-events: auto;
    }
    .welcome-open-btn {
      min-height: 64px;
      height: clamp(64px, 8.5vh, 76px);
      padding: 0 clamp(32px, 4vw, 52px);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: linear-gradient(135deg, #FFD76A 0%, #E8890C 100%);
      color: #0A1633;
      border: none;
      border-radius: 40px;
      font-size: clamp(17px, 2.2vw, 22px);
      font-weight: 800;
      font-family: inherit;
      letter-spacing: 0.3px;
      cursor: pointer;
      box-shadow: 0 10px 30px rgba(232, 137, 12, 0.45), 0 0 20px rgba(255, 215, 106, 0.25);
      transition: transform 180ms ease, box-shadow 180ms ease, filter 180ms ease;
      touch-action: manipulation;
    }
    .welcome-open-btn:hover {
      transform: translateY(-2px) scale(1.03);
      box-shadow: 0 14px 36px rgba(232, 137, 12, 0.6), 0 0 28px rgba(255, 215, 106, 0.4);
      filter: brightness(1.05);
    }
    .welcome-open-btn:active {
      transform: translateY(1px) scale(0.98);
    }
    .welcome-install-btn {
      min-height: 48px;
      padding: 0 24px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 215, 106, 0.35);
      border-radius: 28px;
      color: #ffd76a;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      backdrop-filter: blur(8px);
      transition: all 180ms ease;
    }
    .welcome-install-btn:hover {
      background: rgba(255, 215, 106, 0.2);
      transform: translateY(-1px);
      border-color: rgba(255, 215, 106, 0.6);
    }
    /* WELCOME-CLEANUP: Removed .welcome-drop-hint CSS */
    /* WELCOME-FIX: Compact layout when "Show welcome screen" is off */
    .welcome-screen.is-compact .welcome-logo-container {
      width: clamp(64px, 10vh, 100px);
      height: clamp(64px, 10vh, 100px);
      animation: none !important;
      opacity: 1 !important;
    }
    .welcome-screen.is-compact .welcome-title {
      font-size: clamp(32px, 5vw, 64px);
    }
    .welcome-screen.is-compact .welcome-line-1,
    .welcome-screen.is-compact .welcome-line-2,
    .welcome-screen.is-compact .welcome-underline,
    .welcome-screen.is-compact .welcome-actions {
      animation: none !important;
      opacity: 1 !important;
      transform: none !important;
      width: 60% !important;
    }
    /* WELCOME-FIX: App State Visibility Controls */
    body.state-welcome #fileName,
    body.state-welcome #pageCounter,
    body.state-welcome #btnCloseDeckHeader,
    body.state-welcome #navLeftZone,
    body.state-welcome #navRightZone,
    body.state-welcome #toolbarContainer,
    body.state-welcome #boardDock,
    body.state-welcome #zoomIndicator,
    body.state-welcome #btnZoomReset,
    body.state-welcome #lensCanvas,
    body.state-welcome #spotlightLayer {
      display: none !important;
      pointer-events: none !important;
    }
    body.state-deck #welcomeScreen {
      display: none !important;
    }
    body.state-deck #btnCloseDeckHeader {
      display: inline-flex !important;
    }
    /* PRESENTATION MODE: Zero clutter over PPT - Header hidden, Popups/Toasts suppressed */
    body.state-deck #header {
      transform: translateY(-100%);
      opacity: 0;
      pointer-events: none;
      transition: transform 0.25s ease, opacity 0.25s ease;
    }
    body.state-deck #header:hover,
    body.state-deck #header.header-visible {
      transform: translateY(0);
      opacity: 1;
      pointer-events: auto;
    }
    body.state-deck #toastContainer {
      display: none !important;
      pointer-events: none !important;
    }
    body.state-board #welcomeScreen,
    body.state-board #navLeftZone,
    body.state-board #navRightZone,
    body.state-board #toolbarContainer {
      display: none !important;
    }
    @keyframes welcomeLogoIn {
      from { opacity: 0; transform: scale(0.85); }
      to { opacity: 1; transform: scale(1); }
    }
    @keyframes welcomeTextRise {
      from { opacity: 0; transform: translateY(24px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes welcomeUnderlineIn {
      from { width: 0%; }
      to { width: 80%; }
    }
    @keyframes welcomeGlowPulse {
      from { opacity: 0.6; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1.1); }
    }
    @keyframes welcomeHintFade {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .welcome-logo-container, .welcome-line-1, .welcome-line-2, .welcome-underline, .welcome-actions {
        animation: none !important;
        opacity: 1 !important;
        transform: none !important;
    /* MIC-AI: Sleek Microphone button matching other toolbar tools */
    .mic-btn {
      position: relative;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .mic-icon-wrapper {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .mic-btn.mic-off,
    .btn-mic-header.mic-off {
      color: var(--text-muted, #94a3b8);
      background: transparent;
    }
    .mic-btn.mic-listening,
    .btn-mic-header.mic-listening {
      color: #ef4444 !important;
      background: rgba(239, 68, 68, 0.2) !important;
      border: 1px solid rgba(239, 68, 68, 0.6) !important;
      box-shadow: 0 0 10px rgba(239, 68, 68, 0.35) !important;
    }
    .mic-btn.mic-listening svg,
    .btn-mic-header.mic-listening svg {
      color: #ef4444 !important;
      filter: drop-shadow(0 0 3px rgba(239, 68, 68, 0.8));
    }
    .mic-btn.mic-error,
    .btn-mic-header.mic-error {
      background: rgba(245, 158, 11, 0.2) !important;
      color: #f59e0b !important;
      border: 1px solid #f59e0b !important;
    }
    .mic-error-badge {
      display: none !important;
    }
    .mic-level-meter {
      display: none !important;
    }
    /* Ghost mode: when toolbar dims, mic button stays visible while listening */
    .toolbar-container.dimmed .mic-btn.mic-listening {
      opacity: 0.85 !important;
    }
    /* Zen mode mic dot: 12px pulsing red dot at top-right of stage */
    .mic-zen-dot {
      position: fixed;
      top: 16px;
      right: 20px;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #ef4444;
      box-shadow: 0 0 8px #ef4444;
      animation: micDotPulse 1.4s infinite;
      z-index: 99;
      pointer-events: none;
    }
    @keyframes micDotPulse {
      0% { transform: scale(0.9); opacity: 0.8; }
      50% { transform: scale(1.2); opacity: 1; box-shadow: 0 0 14px #ef4444; }
      100% { transform: scale(0.9); opacity: 0.8; }
    }
  </style>
  <script>
    /* NETLIFY-KILLER: Immediate Script-level Purge before page renders */
    (function() {
      function eradicateNetlify() {
        try {
          var els = document.querySelectorAll('[id*="netlify" i], [class*="netlify" i], a[href*="netlify" i], iframe[src*="netlify" i], netlify-badge, .netlify-badge');
          for (var i = 0; i < els.length; i++) {
            els[i].remove();
          }
          if (document.body) {
            var kids = document.body.children;
            for (var j = kids.length - 1; j >= 0; j--) {
              var k = kids[j];
              if (k.id !== 'stage' && k.id !== 'app' && k.tagName !== 'SCRIPT' && k.tagName !== 'STYLE') {
                var txt = (k.textContent || '').toLowerCase();
                if (txt.indexOf('netlify') !== -1 || (k.querySelector && k.querySelector('a[href*="netlify" i]'))) {
                  k.remove();
                }
              }
            }
          }
        } catch (e) {}
      }
      eradicateNetlify();
      if (typeof MutationObserver !== 'undefined') {
        var obs = new MutationObserver(eradicateNetlify);
        if (document.documentElement) {
          obs.observe(document.documentElement, { childList: true, subtree: true });
        }
      }
      document.addEventListener('DOMContentLoaded', eradicateNetlify);
      window.addEventListener('load', eradicateNetlify);
      setInterval(eradicateNetlify, 250);
    })();
  </script>
</head>
